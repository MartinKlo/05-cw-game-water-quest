<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Well Spotter</title>
  <link href="style.css" rel="stylesheet" type="text/css" />
  <script src="https://cdn.apple-mapkit.com/mk/5.x.x/mapkit.js"></script>
</head>
<body>
  <div class="container">
    <header class="game-header">
      <div class="round-indicator">
        <img src="img/cw_logo.jpg" alt="Charity: Water Logo">
        <span>Round <span id="round-number">1</span></span>
      </div>
      <div class="score-display">
        Score: <span id="score">0</span>
      </div>
    </header>
    <div class="game-area">
      <div class="well-image">
        <img id="well-image" src="img/placeholder.jpg" alt="Well Image">
      </div>
      <div class="map-container">
        <div id="map" class="map"></div>
        <div class="slider-container">
          <label for="population-slider">Population Served:</label>
          <input id="population-slider" type="range" min="10" max="2000" step="10" value="500">
          <span id="slider-value">500</span>
        </div>
        <button id="guess-button">Guess</button>
      </div>
    </div>
    <div class="feedback">
      <p id="feedback-text"></p>
    </div>
    <button id="play-again" style="display: none;">Play Again</button>
  </div>
  <script src="script.js"></script>
</body>
</html>
